Uitleg van semantische HTML-elementen (MDN Web Docs):
- <header>: Bevat inleidende inhoud of navigatiehulpmiddelen voor de pagina of een sectie.
- <nav>: Groepeert belangrijke navigatielinks naar andere pagina's of plekken op de site.
- <main>: Omvat de unieke hoofdinhoud van de pagina, zonder herhalende elementen.
- <footer>: Sluit een pagina of sectie af met metadata, copyright of contactinformatie.
- <article>: Vertegenwoordigt een op zichzelf staand stuk inhoud dat onafhankelijk leesbaar is.
- <aside>: Toont aanvullende inhoud die zijdelings verband houdt met het hoofdonderwerp.
- <a>: Creëert een klikbare hyperlink naar een andere pagina, locatie of bron.
- <img>: Plaatst een visuele afbeelding in het document met een alternatieve omschrijving.
-->
